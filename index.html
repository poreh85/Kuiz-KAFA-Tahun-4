const $=id=>document.getElementById(id);let subject='',questions=[],index=0,score=0,locked=false;
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function home(){$('title').textContent='Pilih Mata Pelajaran';$('description').textContent='Pilih subjek untuk memulakan kuiz. 30 soalan latihan pelbagai tahap bagi setiap subjek.';$('progress').textContent='';$('feedback').textContent='';$('next').classList.add('hidden');$('home').classList.add('hidden');$('content').innerHTML='';Object.keys(bank).forEach(s=>{let b=document.createElement('button');b.className='subject';b.textContent=s+' — '+bank[s].length+' soalan';b.onclick=()=>start(s);$('content').append(b)})}
function start(s){subject=s;questions=shuffle(bank[s]);index=0;score=0;show()}
function show(){locked=false;$('feedback').textContent='';$('next').classList.add('hidden');$('home').classList.remove('hidden');$('title').textContent=subject;$('content').innerHTML='';if(index>=questions.length){$('progress').textContent='Tamat';$('description').textContent='Tahniah! Anda telah menamatkan kuiz.';let p=document.createElement('h2');p.textContent='Markah: '+score+' / '+questions.length;$('content').append(p);let b=document.createElement('button');b.className='primary';b.textContent='Cuba Lagi';b.onclick=()=>start(subject);$('content').append(b);return}$('progress').textContent=(index+1)+' / '+questions.length;$('description').textContent=questions[index][0];let q=questions[index],choices=shuffle(q.slice(1));choices.forEach(answer=>{let b=document.createElement('button');b.className='answer';b.textContent=answer;b.onclick=()=>{if(locked)return;locked=true;let correct=answer===q[1];if(correct)score++;document.querySelectorAll('.answer').forEach(el=>{el.disabled=true;if(el.textContent===q[1])el.classList.add('correct');else if(el===b)el.classList.add('wrong')});$('feedback').textContent=correct?'✅ Betul!':'❌ Jawapan betul: '+q[1];$('next').textContent=index===questions.length-1?'Lihat Markah →':'Soalan Seterusnya →';$('next').classList.remove('hidden')};$('content').append(b)})}
$('next').onclick=()=>{index++;show()};$('home').onclick=home;home();
</script></body></html>
